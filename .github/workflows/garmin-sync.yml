name: Garmin Sync

on:
  schedule:
    # 아침 운동(보통 06:30) 직후 빨리 반영되도록 KST 06:05~09:45 사이 20분마다
    # (GitHub 예약 실행은 몇 분~1시간 정도 앞뒤로 밀릴 수 있음)
    - cron: "5,25,45 21-23 * * *" # KST 06:05 ~ 08:45
    - cron: "5,25,45 0 * * *"     # KST 09:05 ~ 09:45
    - cron: "30 3 * * *"  # KST 12:30
    - cron: "30 12 * * *" # KST 21:30
  workflow_dispatch:
    inputs:
      days:
        description: "days to fetch (first run: 90)"
        default: "7"

# 실행이 겹치면 앞의 실행이 끝난 뒤에 다음 실행
concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install garminconnect requests

      - name: Garmin sync
        run: python scripts/garmin_sync.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAYS: ${{ github.event.inputs.days || '7' }}
