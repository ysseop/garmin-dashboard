<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>러닝 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c1f24; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --ok-bg: #dcfce7; --warn-bg: #fef3c7; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa3b2;
      --line: #2a2f38; --accent: #60a5fa; --ok: #86efac; --warn: #fcd34d; --bad: #fca5a5;
      --ok-bg: #14301f; --warn-bg: #3a2c0b; --bad-bg: #3b1515;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .btns button { margin-left: 6px; }
  button { background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat .unit { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .alert { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
  .alert.ok { background: var(--ok-bg); color: var(--ok); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.bad { background: var(--bad-bg); color: var(--bad); }
  .alert.neutral { background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .chart-box { position: relative; height: 260px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  .setup { max-width: 460px; margin: 40px auto; }
  .setup label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .setup input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; line-height: 1.5; }
  .hidden { display: none; }
  .center { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 처음 접속할 때 한 번만 입력 -->
  <div id="setup" class="card setup hidden">
    <h2>처음 한 번만 설정해 주세요</h2>
    <label for="inUrl">웹앱 주소 (/exec 로 끝나는 주소)</label>
    <input id="inUrl" type="text" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="inKey">API 키</label>
    <input id="inKey" type="password" autocomplete="off" placeholder="키를 입력하세요">
    <div style="margin-top:16px"><button class="primary" id="saveBtn">저장하고 불러오기</button></div>
    <div class="err" id="err"></div>
    <div class="hint">입력한 값은 이 기기의 브라우저에만 저장돼요. 다른 기기에서는 한 번씩 다시 입력해야 합니다.</div>
  </div>

  <div id="loading" class="center hidden">데이터를 불러오는 중...</div>

  <div id="dash" class="hidden">
    <header>
      <h1>러닝 대시보드</h1>
      <div class="btns">
        <button id="refreshBtn">새로고침</button>
        <button id="resetBtn">설정 초기화</button>
      </div>
    </header>

    <div id="alert" class="alert neutral"></div>
    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>주간 거리 (최근 12주)</h2>
      <div class="chart-box"><canvas id="chWeekly"></canvas></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>페이스와 평균 심박 (최근 러닝 20회)</h2>
        <div class="chart-box"><canvas id="chPace"></canvas></div>
      </div>
      <div class="card">
        <h2>심박 존 분포 (최근 4주)</h2>
        <div class="chart-box"><canvas id="chZone"></canvas></div>
        <div class="hint" id="zoneNote"></div>
      </div>
    </div>

    <div class="card">
      <h2>최근 러닝</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>날짜</th><th>이름</th><th class="num">거리</th><th class="num">페이스</th><th class="num">평균 심박</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
var RUN_TYPES = ['running', 'trail_running', 'treadmill_running', 'track_running'];
var DAY = 24 * 60 * 60 * 1000;
var charts = {};

function $(id) { return document.getElementById(id); }
function store(op, k, v) {
  try {
    if (op === 'get') return localStorage.getItem(k);
    if (op === 'set') localStorage.setItem(k, v);
    if (op === 'del') localStorage.removeItem(k);
  } catch (e) {}
  return null;
}
function show(which) {
  ['setup', 'loading', 'dash'].forEach(function (id) {
    $(id).classList.toggle('hidden', id !== which);
  });
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function fmtPace(secPerKm) {
  if (!isFinite(secPerKm) || secPerKm <= 0) return '-';
  var m = Math.floor(secPerKm / 60);
  var s = Math.round(secPerKm - m * 60);
  if (s === 60) { m += 1; s = 0; }
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function fmtDate(d) {
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function weekStart(d) {
  var x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // 월요일 시작
  return x;
}

async function load() {
  var url = store('get', 'garminUrl');
  var key = store('get', 'garminKey');
  if (!url || !key) { show('setup'); return; }
  show('loading');
  try {
    var res = await fetch(url + '?key=' + encodeURIComponent(key));
    var data = await res.json();
    if (!data.ok) {
      throw new Error(data.error === 'unauthorized' ? '키가 맞지 않아요. 다시 확인해 주세요.' : '데이터를 불러오지 못했어요.');
    }
    render(data.rows || []);
    show('dash');
  } catch (e) {
    $('err').textContent = (e && e.message) ? e.message : '불러오지 못했어요. 주소와 키를 확인해 주세요.';
    show('setup');
  }
}

function parseRuns(rows) {
  return rows
    .filter(function (r) { return RUN_TYPES.indexOf(r.type) >= 0 && Number(r.distanceKm) > 0; })
    .map(function (r) {
      return {
        d: new Date(String(r.startTime).replace(' ', 'T')),
        name: r.name || '',
        km: Number(r.distanceKm),
        sec: Number(r.durationSec) || 0,
        hr: Number(r.avgHR) || null,
        z: [1, 2, 3, 4, 5].map(function (i) { return Number(r['z' + i + 'Sec']) || 0; })
      };
    })
    .filter(function (r) { return !isNaN(r.d.getTime()); })
    .sort(function (a, b) { return a.d - b.d; });
}

function sumKm(runs, from, to) {
  return runs.filter(function (r) { return r.d > from && r.d <= to; })
    .reduce(function (a, r) { return a + r.km; }, 0);
}

function render(rows) {
  var runs = parseRuns(rows);
  var now = new Date();
  var t7 = new Date(now - 7 * DAY), t14 = new Date(now - 14 * DAY), t28 = new Date(now - 28 * DAY);

  var last7 = sumKm(runs, t7, now);
  var prev7 = sumKm(runs, t14, t7);
  var runs28 = runs.filter(function (r) { return r.d > t28; });
  var km28 = runs28.reduce(function (a, r) { return a + r.km; }, 0);
  var sec28 = runs28.reduce(function (a, r) { return a + r.sec; }, 0);
  var count7 = runs.filter(function (r) { return r.d > t7; }).length;
  var longest = runs28.reduce(function (a, r) { return Math.max(a, r.km); }, 0);

  // 주간 증가율 안내
  var box = $('alert');
  if (!runs.length) {
    box.className = 'alert neutral';
    box.textContent = '아직 러닝 기록이 없어요. 동기화가 끝나면 여기에 표시됩니다.';
  } else if (prev7 === 0 && last7 > 0) {
    box.className = 'alert neutral';
    box.textContent = '직전 7일에 러닝 기록이 없어서 증가율은 계산하지 않았어요. 지난 7일 거리는 ' + last7.toFixed(1) + 'km 입니다.';
  } else if (prev7 === 0) {
    box.className = 'alert neutral';
    box.textContent = '최근 2주간 러닝 기록이 없어요.';
  } else {
    var change = (last7 / prev7 - 1) * 100;
    var txt = '지난 7일 거리 ' + last7.toFixed(1) + 'km, 직전 7일 ' + prev7.toFixed(1) + 'km (' + (change >= 0 ? '+' : '') + change.toFixed(0) + '%). ';
    if (change > 30) {
      box.className = 'alert bad';
      box.textContent = txt + '주간 거리가 많이 늘었어요. 이렇게 급하게 늘리면 부상 위험이 커져서, 이번 주는 강도나 거리를 조금 낮추는 걸 고려해 보세요.';
    } else if (change > 10) {
      box.className = 'alert warn';
      box.textContent = txt + '증가폭이 다소 커요. 일반적으로 주간 거리는 10% 안팎으로 늘리는 걸 권해요.';
    } else {
      box.className = 'alert ok';
      box.textContent = txt + '무리 없는 범위예요.';
    }
  }

  // 요약 카드
  var stats = [
    ['지난 7일 거리', last7.toFixed(1), 'km'],
    ['지난 7일 러닝', String(count7), '회'],
    ['4주 주평균 거리', (km28 / 4).toFixed(1), 'km'],
    ['4주 평균 페이스', km28 > 0 ? fmtPace(sec28 / km28) : '-', '/km'],
    ['4주 최장 거리', longest.toFixed(1), 'km']
  ];
  $('stats').textContent = '';
  stats.forEach(function (s) {
    var el = document.createElement('div');
    el.className = 'stat';
    var l = document.createElement('div'); l.className = 'label'; l.textContent = s[0];
    var v = document.createElement('div'); v.className = 'value'; v.textContent = s[1];
    var u = document.createElement('span'); u.className = 'unit'; u.textContent = s[2];
    v.appendChild(u); el.appendChild(l); el.appendChild(v);
    $('stats').appendChild(el);
  });

  Chart.defaults.color = cssVar('--muted');
  Chart.defaults.borderColor = cssVar('--line');
  var accent = cssVar('--accent');

  // 주간 거리
  var thisWeek = weekStart(now);
  var labels = [], values = [];
  for (var i = 11; i >= 0; i--) {
    var ws = new Date(thisWeek); ws.setDate(ws.getDate() - 7 * i);
    var we = new Date(ws); we.setDate(we.getDate() + 7);
    labels.push(fmtDate(ws));
    values.push(Number(runs.filter(function (r) { return r.d >= ws && r.d < we; })
      .reduce(function (a, r) { return a + r.km; }, 0).toFixed(1)));
  }
  drawChart('weekly', 'chWeekly', {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: '거리(km)', data: values, backgroundColor: accent, borderRadius: 4 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });

  // 페이스 + 심박
  var recent20 = runs.slice(-20);
  drawChart('pace', 'chPace', {
    type: 'line',
    data: {
      labels: recent20.map(function (r) { return fmtDate(r.d); }),
      datasets: [
        { label: '페이스(분/km)', data: recent20.map(function (r) { return r.km > 0 ? r.sec / r.km : null; }),
          borderColor: accent, backgroundColor: accent, yAxisID: 'y', tension: 0.25 },
        { label: '평균 심박(bpm)', data: recent20.map(function (r) { return r.hr; }),
          borderColor: '#ef4444', backgroundColor: '#ef4444', yAxisID: 'y1', tension: 0.25 }
      ]
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { tooltip: { callbacks: { label: function (c) {
        return c.dataset.label.split('(')[0] + ': ' + (c.datasetIndex === 0 ? fmtPace(c.parsed.y) : c.parsed.y);
      } } } },
      scales: {
        y: { reverse: true, ticks: { callback: function (v) { return fmtPace(v); } } },
        y1: { position: 'right', grid: { drawOnChartArea: false } }
      }
    }
  });

  // 심박 존 분포
  var zones = [0, 0, 0, 0, 0];
  runs28.forEach(function (r) { r.z.forEach(function (s, i) { zones[i] += s; }); });
  var zt = zones.reduce(function (a, b) { return a + b; }, 0);
  drawChart('zone', 'chZone', {
    type: 'bar',
    data: {
      labels: ['존1 (회복)', '존2 (가벼운 유산소)', '존3 (유산소)', '존4 (젖산 역치)', '존5 (최대)'],
      datasets: [{ label: '비율(%)', data: zones.map(function (s) { return zt ? Number((s / zt * 100).toFixed(1)) : 0; }),
        backgroundColor: ['#94a3b8', '#22c55e', '#eab308', '#f97316', '#ef4444'], borderRadius: 4 }]
    },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, max: 100 } } }
  });
  $('zoneNote').textContent = zt ? '' : '심박 존 데이터가 아직 없어요.';

  // 최근 러닝 표
  var tb = $('recent');
  tb.textContent = '';
  runs.slice(-10).reverse().forEach(function (r) {
    var tr = document.createElement('tr');
    var cells = [
      [r.d.getFullYear() + '-' + String(r.d.getMonth() + 1).padStart(2, '0') + '-' + String(r.d.getDate()).padStart(2, '0'), ''],
      [r.name, ''],
      [r.km.toFixed(2) + ' km', 'num'],
      [fmtPace(r.sec / r.km) + ' /km', 'num'],
      [r.hr ? String(r.hr) : '-', 'num']
    ];
    cells.forEach(function (c) {
      var td = document.createElement('td');
      td.textContent = c[0];
      if (c[1]) td.className = c[1];
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

function drawChart(name, canvasId, config) {
  if (charts[name]) charts[name].destroy();
  charts[name] = new Chart($(canvasId), config);
}

$('saveBtn').addEventListener('click', function () {
  var url = $('inUrl').value.trim();
  var key = $('inKey').value.trim();
  if (!url || !key) { $('err').textContent = '주소와 키를 모두 입력해 주세요.'; return; }
  store('set', 'garminUrl', url);
  store('set', 'garminKey', key);
  $('err').textContent = '';
  load();
});
$('refreshBtn').addEventListener('click', load);
$('resetBtn').addEventListener('click', function () {
  store('del', 'garminUrl');
  store('del', 'garminKey');
  $('inKey').value = '';
  show('setup');
});

load();
</script>
</body>
</html>
