<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0e17;--bg2:#141a2b;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);--tx:#eef1f8;--mu:#8e98b3;--a1:#8b5cf6;--a2:#22d3ee;--hot:#fb7185;--ok:#34d399;--wn:#fbbf24}
@media(prefers-color-scheme:light){:root{--bg:#f3f5fb;--bg2:#e6eaf7;--card:#fff;--bd:#e3e7f2;--tx:#161a29;--mu:#667090}}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:radial-gradient(900px 500px at 10% -10%,#3b2a7a55,transparent),radial-gradient(800px 500px at 100% 0,#0e7490444,transparent),linear-gradient(var(--bg),var(--bg2)) fixed}
.w{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600;letter-spacing:.3px}
.sec{font-size:12px;color:var(--mu);margin:18px 2px 8px;letter-spacing:1.5px}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
button.on,button.pri{background:linear-gradient(90deg,var(--a1),var(--a2));border-color:transparent;color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:12px}
@media(max-width:720px){.g2{grid-template-columns:1fr}}
.k{font-size:12px;color:var(--mu)}
.v{font-size:28px;font-weight:800;margin-top:4px;line-height:1.1}
.v small{font-size:13px;font-weight:500;color:var(--mu);margin-left:3px}
.sub{font-size:12px;color:var(--mu);margin-top:6px}
.hint{border-radius:18px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.55;border:1px solid var(--bd)}
.hint.ok{background:#34d3991f;color:var(--ok)}.hint.wn{background:#fbbf241f;color:var(--wn)}.hint.bad{background:#fb71851f;color:var(--hot)}.hint.nu{background:var(--card);color:var(--mu)}
.cb{position:relative;height:250px}
.seg{display:flex;gap:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}.n{text-align:right}
.tw{overflow-x:auto}
.setup{max-width:440px;margin:50px auto}
.setup label{display:block;font-size:13px;color:var(--mu);margin:14px 0 5px}
.setup input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:14px}
.err{color:var(--hot);font-size:13px;min-height:18px;margin-top:10px}
.hide{display:none}.ctr{text-align:center;color:var(--mu);padding:80px 0}
</style>
</head>
<body>
<div class="w">
<div id="setup" class="card setup hide">
  <h2>처음 한 번만 설정해 주세요</h2>
  <label for="u">웹앱 주소 (/exec 로 끝나는 주소)</label><input id="u" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="k">API 키</label><input id="k" type="password" autocomplete="off">
  <div style="margin-top:16px"><button class="pri" id="save">저장하고 불러오기</button></div>
  <div class="err" id="err"></div>
  <div class="sub">입력한 값은 이 기기의 브라우저에만 저장돼요.</div>
</div>
<div id="load" class="ctr hide">불러오는 중...</div>

<div id="dash" class="hide">
  <div class="hd"><h1>Training Dashboard</h1>
    <div class="seg"><button id="rf">새로고침</button><button id="rs">설정 초기화</button></div></div>

  <div id="hint" class="hint nu"></div>

  <div class="sec">오늘의 컨디션</div>
  <div class="grid" id="cond"></div>

  <div class="sec" style="display:flex;justify-content:space-between;align-items:center">
    <span>운동 요약 (최근 28일)</span>
    <span class="seg" id="seg"><button data-g="hiit" class="on">HIIT</button><button data-g="run">러닝</button><button data-g="all">전체</button></span></div>
  <div class="grid" id="sum"></div>

  <div class="g2">
    <div class="card"><h2>주간 운동 시간 (분, 12주)</h2><div class="cb"><canvas id="c1"></canvas></div></div>
    <div class="card"><h2>세션별 심박과 무산소 효과</h2><div class="cb"><canvas id="c2"></canvas></div></div>
  </div>
  <div class="g2">
    <div class="card"><h2>심박 존 분포 (28일)</h2><div class="cb"><canvas id="c3"></canvas></div><div class="sub" id="zn"></div></div>
    <div class="card"><h2>HRV 추이 (30일)</h2><div class="cb"><canvas id="c4"></canvas></div><div class="sub" id="hn"></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>수면 (최근 14일, 시간)</h2><div class="cb"><canvas id="c5"></canvas></div><div class="sub" id="sn"></div></div>

  <div class="sec">최근 세션</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>날짜</th><th>이름</th><th class="n">시간</th><th class="n">평균 심박</th><th class="n">최대</th><th class="n">무산소 TE</th><th class="n">부하</th><th class="n">kcal</th></tr></thead>
    <tbody id="tb"></tbody></table></div></div>
</div>
</div>

<script>
var RUN=['running','trail_running','treadmill_running','track_running'],DAY=864e5,ch={},grp='hiit',D=null;
var $=function(i){return document.getElementById(i)};
function st(op,k,v){try{if(op==='g')return localStorage.getItem(k);if(op==='s')localStorage.setItem(k,v);if(op==='d')localStorage.removeItem(k)}catch(e){}return null}
function show(w){['setup','load','dash'].forEach(function(i){$(i).classList.toggle('hide',i!==w)})}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function num(v){return(v===''||v==null||isNaN(Number(v)))?null:Number(v)}
function md(d){return(d.getMonth()+1)+'/'+d.getDate()}
function pd(s){return new Date(String(s).replace(' ','T'))}
function hm(sec){return sec==null?'-':Math.floor(sec/3600)+'시간 '+Math.round(sec%3600/60)+'분'}
function wk(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function gOf(t){return t==='hiit'?'hiit':(RUN.indexOf(t)>=0?'run':'etc')}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function stat(box,k,v,u,s){var c=el('div','card');c.appendChild(el('div','k',k));var x=el('div','v',v);if(u)x.appendChild(el('small','',u));c.appendChild(x);if(s)c.appendChild(el('div','sub',s));box.appendChild(c)}
function draw(n,id,cfg){if(ch[n])ch[n].destroy();ch[n]=new Chart($(id),cfg)}

async function load(){
  var u=st('g','garminUrl'),k=st('g','garminKey');
  if(!u||!k){show('setup');return}
  show('load');
  try{
    var r=await fetch(u+'?key='+encodeURIComponent(k)),d=await r.json();
    if(!d.ok)throw new Error(d.error==='unauthorized'?'키가 맞지 않아요.':'데이터를 불러오지 못했어요.');
    D=d;render();show('dash');
  }catch(e){$('err').textContent=e.message||'불러오지 못했어요. 주소와 키를 확인해 주세요.';show('setup')}
}

function render(){
  var now=new Date(),t28=new Date(now-28*DAY),t7=new Date(now-7*DAY);
  var acts=(D.rows||[]).map(function(r){return{d:pd(r.startTime),g:gOf(r.type),name:r.name||r.type,min:(num(r.durationSec)||0)/60,
    hr:num(r.avgHR),mx:num(r.maxHR),an:num(r.anaerobicTE),tl:num(r.trainingLoad),kc:num(r.calories),km:num(r.distanceKm)||0,
    z:[1,2,3,4,5].map(function(i){return num(r['z'+i+'Sec'])||0})}}).filter(function(a){return!isNaN(a.d.getTime())}).sort(function(a,b){return a.d-b.d});
  var well=(D.wellness||[]).map(function(w){return{d:new Date(String(w.date)+'T00:00:00'),sl:num(w.sleepSec),dp:num(w.deepSec),lt:num(w.lightSec),rm:num(w.remSec),aw:num(w.awakeSec),
    sc:num(w.sleepScore),hv:num(w.hrvLastNight),hw:num(w.hrvWeeklyAvg),hs:w.hrvStatus||'',rh:num(w.restingHR),bh:num(w.bodyBatteryHigh),bl:num(w.bodyBatteryLow),
    ss:num(w.avgStress),rd:num(w.trainingReadiness)}}).filter(function(w){return!isNaN(w.d.getTime())}).sort(function(a,b){return a.d-b.d});
  var sel=acts.filter(function(a){return grp==='all'||a.g===grp}),s28=sel.filter(function(a){return a.d>t28});
  var tw=well.filter(function(w){return w.sl||w.hv||w.rd||w.rh}).pop();

  // 오늘의 한줄 (규칙 기반)
  var h=$('hint'),hi7=acts.filter(function(a){return a.g==='hiit'&&a.d>t7}).length,bad=[],wn=[];
  if(tw){
    if(tw.rd!=null&&tw.rd<40)bad.push('훈련 준비도 '+tw.rd);
    if(tw.sc!=null&&tw.sc<60)wn.push('수면 점수 '+tw.sc);
    if(tw.hs&&tw.hs!=='BALANCED')wn.push('HRV 상태 '+tw.hs);
  }
  if(hi7>=4)wn.push('최근 7일 HIIT '+hi7+'회');
  if(!tw&&!acts.length){h.className='hint nu';h.textContent='아직 데이터가 없어요. 동기화가 끝나면 표시됩니다.'}
  else if(bad.length){h.className='hint bad';h.textContent='회복이 부족해 보여요 ('+bad.concat(wn).join(', ')+'). 오늘은 강도를 낮추거나 쉬어가는 걸 권해요.'}
  else if(wn.length){h.className='hint wn';h.textContent='주의 신호: '+wn.join(', ')+'. 고강도는 가볍게 가져가거나 회복 시간을 챙겨보세요.'}
  else{h.className='hint ok';h.textContent=tw?'컨디션이 양호해요. 계획한 훈련을 진행해도 좋아요.':'최근 운동 기록을 불러왔어요. 건강 데이터는 동기화 후 표시됩니다.'}

  // 컨디션 카드
  var c=$('cond');c.textContent='';
  if(tw){
    stat(c,'수면',tw.sl?hm(tw.sl):'-','',tw.sc!=null?'점수 '+tw.sc:'');
    stat(c,'HRV(지난밤)',tw.hv!=null?tw.hv:'-','ms',tw.hw!=null?'주평균 '+tw.hw+(tw.hs?' · '+tw.hs:''):tw.hs);
    stat(c,'바디배터리',tw.bh!=null?tw.bh:'-','',tw.bl!=null?'최저 '+tw.bl:'');
    stat(c,'안정시 심박',tw.rh!=null?tw.rh:'-','bpm',tw.ss!=null?'스트레스 '+tw.ss:'');
    stat(c,'훈련 준비도',tw.rd!=null?tw.rd:'-','',tw.d?md(tw.d)+' 기준':'');
  }else stat(c,'건강 데이터','없음','','wellness 시트에 데이터가 들어오면 표시돼요');

  // 운동 요약
  var sm=$('sum');sm.textContent='';
  var tm=s28.reduce(function(a,x){return a+x.min},0),hrs=s28.filter(function(x){return x.hr}),an=s28.filter(function(x){return x.an!=null});
  stat(sm,'세션 수',s28.length,'회','주평균 '+(s28.length/4).toFixed(1)+'회');
  stat(sm,'총 운동 시간',Math.round(tm),'분','');
  stat(sm,'평균 심박',hrs.length?Math.round(hrs.reduce(function(a,x){return a+x.hr},0)/hrs.length):'-','bpm','');
  stat(sm,'평균 무산소 효과',an.length?(an.reduce(function(a,x){return a+x.an},0)/an.length).toFixed(1):'-','','');
  stat(sm,'소모 칼로리',Math.round(s28.reduce(function(a,x){return a+(x.kc||0)},0)),'kcal','');

  Chart.defaults.color=cv('--mu');Chart.defaults.borderColor=cv('--bd');
  var A1=cv('--a1'),A2=cv('--a2'),HOT=cv('--hot');

  // 주간 운동 시간 (종류별 누적)
  var tw0=wk(now),lb=[],ser={hiit:[],run:[],etc:[]};
  for(var i=11;i>=0;i--){var ws=new Date(tw0);ws.setDate(ws.getDate()-7*i);var we=new Date(ws);we.setDate(we.getDate()+7);lb.push(md(ws));
    ['hiit','run','etc'].forEach(function(g){ser[g].push(Math.round(acts.filter(function(a){return a.g===g&&a.d>=ws&&a.d<we}).reduce(function(s,a){return s+a.min},0)))})}
  draw('c1','c1',{type:'bar',data:{labels:lb,datasets:[{label:'HIIT',data:ser.hiit,backgroundColor:A1},{label:'러닝',data:ser.run,backgroundColor:A2},{label:'기타',data:ser.etc,backgroundColor:'#64748b'}]},
    options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}});

  // 세션별 심박 + 무산소 효과
  var r15=sel.slice(-15);
  draw('c2','c2',{data:{labels:r15.map(function(a){return md(a.d)}),datasets:[
    {type:'bar',label:'무산소 TE',data:r15.map(function(a){return a.an}),backgroundColor:A1+'aa',yAxisID:'y1',borderRadius:4},
    {type:'line',label:'평균 심박',data:r15.map(function(a){return a.hr}),borderColor:A2,backgroundColor:A2,tension:.3},
    {type:'line',label:'최대 심박',data:r15.map(function(a){return a.mx}),borderColor:HOT,backgroundColor:HOT,tension:.3}]},
    options:{maintainAspectRatio:false,scales:{y:{title:{display:true,text:'bpm'}},y1:{position:'right',min:0,max:5,grid:{drawOnChartArea:false}}}}});

  // 심박 존
  var zs=[0,0,0,0,0];s28.forEach(function(a){a.z.forEach(function(v,i){zs[i]+=v})});var zt=zs.reduce(function(a,b){return a+b},0);
  draw('c3','c3',{type:'bar',data:{labels:['존1','존2','존3','존4','존5'],datasets:[{data:zs.map(function(v){return zt?+(v/zt*100).toFixed(1):0}),
    backgroundColor:['#94a3b8','#34d399','#fbbf24','#fb923c','#fb7185'],borderRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,title:{display:true,text:'%'}}}}});
  $('zn').textContent=zt?'':'심박 존 데이터가 아직 없어요.';

  // HRV
  var w30=well.filter(function(w){return w.d>new Date(now-30*DAY)});
  draw('c4','c4',{type:'line',data:{labels:w30.map(function(w){return md(w.d)}),datasets:[
    {label:'지난밤 평균',data:w30.map(function(w){return w.hv}),borderColor:A2,backgroundColor:A2,tension:.3,spanGaps:true},
    {label:'주평균',data:w30.map(function(w){return w.hw}),borderColor:A1,backgroundColor:A1,borderDash:[5,4],tension:.3,spanGaps:true,pointRadius:0}]},
    options:{maintainAspectRatio:false,scales:{y:{title:{display:true,text:'ms'}}}}});
  $('hn').textContent=w30.some(function(w){return w.hv!=null})?'':'HRV 데이터가 아직 없어요.';

  // 수면
  var w14=well.filter(function(w){return w.sl}).slice(-14),H=function(v){return v==null?0:+(v/3600).toFixed(2)};
  draw('c5','c5',{type:'bar',data:{labels:w14.map(function(w){return md(w.d)}),datasets:[
    {label:'깊은 수면',data:w14.map(function(w){return H(w.dp)}),backgroundColor:A1},
    {label:'얕은 수면',data:w14.map(function(w){return H(w.lt)}),backgroundColor:A2+'99'},
    {label:'REM',data:w14.map(function(w){return H(w.rm)}),backgroundColor:'#f472b6'},
    {label:'깸',data:w14.map(function(w){return H(w.aw)}),backgroundColor:'#64748b'}]},
    options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}});
  $('sn').textContent=w14.length?'':'수면 데이터가 아직 없어요.';

  // 표
  var tb=$('tb');tb.textContent='';
  sel.slice(-8).reverse().forEach(function(a){var tr=el('tr');
    [[a.d.getFullYear()+'-'+String(a.d.getMonth()+1).padStart(2,'0')+'-'+String(a.d.getDate()).padStart(2,'0'),''],[a.name,''],
     [Math.round(a.min)+'분','n'],[a.hr||'-','n'],[a.mx||'-','n'],[a.an!=null?a.an:'-','n'],[a.tl||'-','n'],[a.kc||'-','n']].forEach(function(c){tr.appendChild(el('td',c[1],String(c[0])))});
    tb.appendChild(tr)});
}

$('save').onclick=function(){var u=$('u').value.trim(),k=$('k').value.trim();if(!u||!k){$('err').textContent='주소와 키를 모두 입력해 주세요.';return}
  st('s','garminUrl',u);st('s','garminKey',k);$('err').textContent='';load()};
$('rf').onclick=load;
$('rs').onclick=function(){st('d','garminUrl');st('d','garminKey');$('k').value='';show('setup')};
$('seg').onclick=function(e){var g=e.target.getAttribute&&e.target.getAttribute('data-g');if(!g||!D)return;grp=g;
  Array.prototype.forEach.call($('seg').children,function(b){b.classList.toggle('on',b===e.target)});render()};
load();
</script>
</body>
</html>
